services:
  server:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${SERVER_PORT:-5000}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['PORT'] + '/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web-tester:
    build: ./clients/web-tester
    env_file:
      - path: .env
        required: false
    environment:
      # URL que usa el navegador para conectarse al servidor
      SERVER_URL: ${SERVER_PUBLIC_URL:-http://localhost:5000}
      WEB_TESTER_PORT: ${WEB_TESTER_PORT:-3000}
    ports:
      - "${WEB_TESTER_PORT:-3000}:${WEB_TESTER_PORT:-3000}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
